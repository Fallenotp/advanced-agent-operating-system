<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="The five steps, in order: 1. Onboard it like a new hire, write the job first. 2. Match the oversight to the stakes, limit what it can touch. 3. Never take the first look, check its work before you see it. 4. Every correction becomes the system, log it and rewrite the skill. 5. Make it proactive, only for boring recurring problems. A correction sends the work back to step 3, the check. Each step depends on the one before it.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">
    <g>
      <rect x="0" y="20" width="176" height="100" rx="10" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="88" y="56" font-size="15" font-weight="700" fill="#111111">1. ONBOARD</text>
      <text x="88" y="91" font-size="14" fill="#555555">Write the job first.</text>
    </g>
    <text x="191" y="78" font-size="22" fill="#111111">→</text>
    <g>
      <rect x="206" y="20" width="176" height="100" rx="10" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="294" y="56" font-size="15" font-weight="700" fill="#111111">2. OVERSIGHT</text>
      <text x="294" y="80" font-size="14" fill="#555555">Limit what it</text>
      <text x="294" y="102" font-size="14" fill="#555555">can touch.</text>
    </g>
    <text x="397" y="78" font-size="22" fill="#111111">→</text>
    <g>
      <rect x="412" y="20" width="176" height="100" rx="10" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="500" y="56" font-size="15" font-weight="700" fill="#111111">3. CHECK</text>
      <text x="500" y="80" font-size="14" fill="#555555">Check its work</text>
      <text x="500" y="102" font-size="14" fill="#555555">before you see it.</text>
    </g>
    <text x="603" y="78" font-size="22" fill="#111111">→</text>
    <g>
      <rect x="618" y="20" width="176" height="100" rx="10" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="706" y="56" font-size="15" font-weight="700" fill="#111111">4. CORRECT</text>
      <text x="706" y="80" font-size="14" fill="#555555">Log it, rewrite</text>
      <text x="706" y="102" font-size="14" fill="#555555">the skill.</text>
    </g>
    <text x="809" y="78" font-size="22" fill="#111111">→</text>
    <g>
      <rect x="824" y="20" width="176" height="100" rx="10" fill="none" stroke="#111111" stroke-width="2"/>
      <text x="912" y="56" font-size="15" font-weight="700" fill="#111111">5. PROACT</text>
      <text x="912" y="80" font-size="14" fill="#555555">Only boring,</text>
      <text x="912" y="102" font-size="14" fill="#555555">recurring jobs.</text>
    </g>
    <path d="M912,120 V152 H500 V124" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="706" y="172" font-size="14" fill="#555555">a correction goes back to the check</text>
    <text x="500" y="206" font-size="16" fill="#555555">Use them in order. Skipping ahead is what breaks things.</text>
  </g>
</svg>
